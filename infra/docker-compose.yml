services:
  bindery-api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "node apps/api/server.mjs"
    ports:
      - "4311:4311"
    volumes:
      - ..:/workspace
    environment:
      BINDERY_API_PORT: "4311"
  bindery-web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "node apps/web/server.mjs"
    ports:
      - "4310:4310"
    volumes:
      - ..:/workspace
    environment:
      BINDERY_WEB_PORT: "4310"

  # Mattermost is the visual office layer. Enable when credentials and storage are ready.
  # mattermost:
  #   image: mattermost/mattermost-team-edition:latest
  #   ports:
  #     - "8065:8065"
