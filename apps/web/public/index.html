<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BINDERY BOX · Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ── Command bar ───────────────────────────────────────────────── -->
    <header class="commandbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◧</span>
        <div class="brand-text">
          <strong>BINDERY BOX</strong>
          <small id="brand-sub">Manufacturing Control Room</small>
        </div>
      </div>

      <div class="command-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="에이전트·업무·지식 검색  ( / )" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
      </div>

      <div class="command-actions">
        <div class="conn-state" id="conn-state" title="API 연결 상태">
          <span class="dot"></span><span id="conn-label">connecting…</span>
        </div>
        <button class="qa" id="seed" title="데모 상태 재시드">⟲ Seed</button>
        <button class="qa primary" id="refresh" title="전체 새로고침">↻ Refresh</button>
      </div>
    </header>

    <!-- ── Workspace shell: sidebar · board · inspector ──────────────── -->
    <div class="shell">
      <!-- Left: organization -->
      <aside class="sidebar" id="sidebar">
        <section class="org-head">
          <div class="org-avatar" id="org-avatar">MF</div>
          <div class="org-meta">
            <strong id="org-name">MUFI Manufacturing</strong>
            <small id="org-edition">manufacturing edition</small>
          </div>
        </section>

        <nav class="ws-switch">
          <span class="rail-label">Workspaces</span>
          <div id="ws-list" class="ws-list"></div>
        </nav>

        <section class="org-section">
          <div class="rail-label-row">
            <span class="rail-label">Agent Org</span>
            <span class="rail-count" id="agent-count">0</span>
          </div>
          <div id="agents" class="agent-list"></div>
        </section>

        <section class="org-section">
          <div class="rail-label-row">
            <span class="rail-label">Connector Hub</span>
            <span class="rail-count" id="connector-count">0</span>
          </div>
          <div id="connectors" class="connector-list"></div>
        </section>
      </aside>

      <!-- Center: operations board -->
      <main class="board" id="board">
        <div class="board-head">
          <div>
            <h2>Operations Board</h2>
            <p class="board-sub">업무 큐 · 실행 · 승인 대기 · 완료 흐름</p>
          </div>
          <div class="kpi-strip" id="kpi-strip"></div>
        </div>

        <div class="flow-rail" id="flow-rail"></div>

        <div class="lanes" id="lanes"></div>
      </main>

      <!-- Right: inspector -->
      <aside class="inspector" id="inspector">
        <section class="insp-card">
          <header class="insp-head">
            <h3>Approval Center</h3>
            <span class="insp-badge" id="approval-badge">0</span>
          </header>
          <div id="approvals" class="approval-list"></div>
        </section>

        <section class="insp-card">
          <header class="insp-head">
            <h3>Knowledge Graph</h3>
            <span class="insp-badge soft" id="knowledge-badge">0</span>
          </header>
          <div class="graph-mini" id="graph-mini"></div>
          <div id="knowledge" class="relation-list"></div>
        </section>

        <section class="insp-card">
          <header class="insp-head">
            <h3>Office Activity</h3>
            <span class="insp-badge soft">Mattermost</span>
          </header>
          <div id="office" class="office-feed"></div>
        </section>
      </aside>
    </div>

    <!-- ── Live Operations Log dock ──────────────────────────────────── -->
    <footer class="live-dock" id="live-dock">
      <div class="live-head">
        <div class="live-title">
          <span class="pulse" id="live-pulse" aria-hidden="true"></span>
          <h3>Live Operations Log</h3>
          <span class="live-meta" id="live-meta">—</span>
        </div>
        <div class="live-controls">
          <div class="live-filters" id="live-filters">
            <button class="lf active" data-src="all">all</button>
            <button class="lf" data-src="agent">agent</button>
            <button class="lf" data-src="runtime">runtime</button>
            <button class="lf" data-src="audit">audit</button>
            <button class="lf" data-src="office">office</button>
          </div>
          <button class="auto-toggle active" id="auto-toggle" title="2.5초 자동 새로고침">
            <span class="auto-dot"></span><span id="auto-label">Auto 2.5s</span>
          </button>
          <button class="qa" id="live-refresh" title="로그 수동 새로고침">↻</button>
        </div>
      </div>
      <div class="live-body" id="live-log"></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
