<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BINDERY BOX · Company Simulator</title>
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-panel="stream">
  <div class="sim" id="sim">

    <!-- ── Command bar ───────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◧</span>
        <div class="brand-text">
          <strong>BINDERY BOX</strong>
          <small id="brand-sub">Company Simulator</small>
        </div>
        <span class="tier-chip" id="tier-chip" title="회사 운영 단계">Seed</span>
      </div>

      <div class="topbar-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="에이전트·미션·이벤트 검색  ( / )"
               autocomplete="off" spellcheck="false" aria-label="검색" />
        <kbd>/</kbd>
      </div>

      <div class="topbar-actions">
        <div class="conn" id="conn" title="API 연결 상태">
          <span class="conn-dot"></span><span id="conn-label">connecting…</span>
        </div>
        <button class="ghost-btn drawer-only" id="insp-toggle" title="미션 인스펙터">◑ Inspector</button>
        <button class="ghost-btn" id="debug-toggle" title="기술 로그 드로어 (raw)">⌗ Debug</button>
        <button class="ghost-btn" id="seed" title="회사 데모 상태 재시드">⟲ Seed</button>
        <button class="ghost-btn primary" id="refresh" title="전체 새로고침">↻ Refresh</button>
      </div>
    </header>

    <!-- ── Cockpit ───────────────────────────────────────────────────── -->
    <div class="cockpit">

      <!-- LEFT · Company map -->
      <aside class="col col-map" id="col-map" aria-label="Company map">
        <section class="panel vitals" id="vitals"></section>
        <section class="panel">
          <header class="panel-head"><h3>Agent Topology</h3><span class="panel-sub" id="topo-sub">—</span></header>
          <div class="topo" id="topo"></div>
        </section>
        <section class="panel">
          <header class="panel-head"><h3>Operations Lanes</h3></header>
          <div class="lanemap" id="lanemap"></div>
        </section>
        <section class="panel grow">
          <header class="panel-head"><h3>Agent Roster</h3><span class="panel-sub" id="roster-sub">0</span></header>
          <div class="roster" id="roster"></div>
        </section>
      </aside>

      <!-- CENTER · Operations stream -->
      <main class="col col-stream" id="col-stream" aria-label="Operations stream">
        <section class="hero" id="hero"></section>

        <section class="pipeline" id="pipeline"></section>

        <section class="kpi-grid" id="kpis"></section>

        <section class="panel objectives-panel">
          <header class="panel-head">
            <h3>Daily Objectives</h3>
            <span class="panel-sub" id="obj-sub">0 / 0</span>
          </header>
          <div class="objectives" id="objectives"></div>
        </section>

        <section class="panel stream-panel grow">
          <header class="panel-head">
            <h3>Operations Stream</h3>
            <span class="panel-sub">에이전트 업무 · 보고 · 결재 내러티브</span>
          </header>
          <div class="stream" id="stream"></div>
        </section>
      </main>

      <!-- RIGHT · Mission inspector -->
      <aside class="col col-inspector" id="col-inspector" aria-label="Mission inspector">
        <button class="drawer-close drawer-only" id="insp-close" aria-label="닫기">✕</button>

        <section class="panel alerts-panel">
          <header class="panel-head"><h3>Alerts</h3><span class="badge warn" id="alert-badge">0</span></header>
          <div class="alerts" id="alerts"></div>
        </section>

        <section class="panel">
          <header class="panel-head"><h3>Mission Board</h3><span class="panel-sub" id="mission-sub">0</span></header>
          <div class="missions" id="missions"></div>
        </section>

        <section class="panel">
          <header class="panel-head"><h3>Achievements</h3><span class="panel-sub" id="ach-sub">0</span></header>
          <div class="achievements" id="achievements"></div>
        </section>

        <section class="panel grow">
          <header class="panel-head"><h3>Knowledge Graph</h3><span class="panel-sub" id="kg-sub">0</span></header>
          <div class="kg-mini" id="kg-mini"></div>
        </section>
      </aside>
    </div>

    <!-- ── Debug / raw log drawer (demoted technical surface) ─────────── -->
    <section class="debug-drawer" id="debug-drawer" aria-label="Technical log">
      <header class="debug-head">
        <div class="debug-title">
          <span class="pulse" id="live-pulse" aria-hidden="true"></span>
          <h3>Debug · Raw Live Log</h3>
          <span class="debug-meta" id="live-meta">—</span>
        </div>
        <div class="debug-controls">
          <div class="lf-row" id="live-filters">
            <button class="lf active" data-src="all">all</button>
            <button class="lf" data-src="agent">agent</button>
            <button class="lf" data-src="runtime">runtime</button>
            <button class="lf" data-src="audit">audit</button>
            <button class="lf" data-src="office">office</button>
          </div>
          <button class="auto-toggle active" id="auto-toggle" title="2.5초 자동 새로고침">
            <span class="auto-dot"></span><span id="auto-label">Auto 2.5s</span>
          </button>
          <button class="ghost-btn" id="live-refresh" title="로그 수동 새로고침">↻</button>
          <button class="ghost-btn" id="debug-close" title="드로어 닫기">✕</button>
        </div>
      </header>
      <div class="debug-body" id="live-log"></div>
    </section>

    <!-- ── Mobile bottom nav ─────────────────────────────────────────── -->
    <nav class="bottom-nav" aria-label="패널 전환">
      <button class="bn" data-nav="map"><span>◫</span>Map</button>
      <button class="bn active" data-nav="stream"><span>≋</span>Stream</button>
      <button class="bn" data-nav="inspector"><span>◑</span>Missions</button>
      <button class="bn" data-nav="debug"><span>⌗</span>Debug</button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
